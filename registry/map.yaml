# Architecture map: the console's Map view (Homelab page, default). Pure data: edit this file
# to move, add or rewire anything; the gateway re-reads it when it changes and serves it at
# GET /homelab/map with live health folded in.
#
# layout
#   columns     one {x, w} per grid column, in SVG units (the map is 680 wide)
#   row_height  vertical step per row; top = y of row 0. Rows may be fractions (0.5).
#   unplaced_col  where registry services that no node covers appear (flagged "not on the
#               map yet"), so a new service shows up even before anyone edits this file
#
# nodes
#   id, label, sub   sub is optional (a services_group node shows its service count)
#   kind        client | homelab | external   (homelab nodes sit inside the homelab frame)
#   col, row    grid position
#   services    registry ids whose health rolls up into this node's dot
#   services_group  every registry service in that group not covered by another node
#   integrations    /health/integrations keys for external nodes' dots
#   about       one line on what it does (console panel and the public portfolio map)
#   public      false keeps it, and every line touching it, off the public map
#               (GET /homelab/map/public, published to the portfolio by Sazed)
#   public_sub  public subtitle; by default the subtitle minus container numbers
#
# edges
#   from, to    node ids (the arrow points at `to`)
#   signals     Activity events that light this line up live (and count as its traffic):
#                 kind  regex on the event kind (full match), e.g. llm, tool, job\.pr, gw\.notify
#                 title regex searched in the event title, case-insensitive (optional)
#                 agent the job's agent, agy | claude (optional)
#               Job steps arrive as kind job.step with the job's agent.
#   quiet       true for lines with no Activity signal (polling, browsing): they animate slowly
#               and the weekly drift check doesn't report them as unused
#   route       over: drawn above the map (for lines that would cross other nodes)

layout:
  columns:
    - {x: 4, w: 118}
    - {x: 136, w: 104}
    - {x: 266, w: 116}
    - {x: 408, w: 112}
    - {x: 552, w: 116}
  row_height: 65
  top: 40
  unplaced_col: 3

nodes:
  # Clients
  - {id: phone, label: iPhone, sub: Console app, kind: client, col: 0, row: 1,
     about: "The dashboard on my phone, over Tailscale"}
  - {id: desktop, label: Desktop, sub: Browser, kind: client, col: 0, row: 2,
     about: "The dashboard in a desktop browser"}
  - {id: claude-code, label: Claude Code, sub: MCP client, kind: client, col: 0, row: 4,
     services: [claude-code],
     about: "Claude Code and Claude Desktop connect through the gateway's MCP server"}

  # Homelab
  - {id: console, label: Console, sub: "Caddy, CT 106", kind: homelab, col: 1, row: 2,
     services: [sazed-console],
     about: "Web dashboard served by Caddy, which adds the API keys"}
  - {id: proxmox, label: Proxmox, sub: Host, kind: homelab, col: 1, row: 6,
     services: [proxmox],
     about: "The Proxmox host the containers run on"}
  - {id: sazed, label: Sazed, sub: "Agent, CT 106", kind: homelab, col: 2, row: 0.5,
     services: [sazed],
     about: "The agent: tools, memory, automations and background jobs"}
  - {id: gateway, label: Gateway, sub: "APIs, MCP, CT 104", kind: homelab, col: 2, row: 2.5,
     services: [api-gateway],
     about: "Handles outside API calls, health checks, alerts and the MCP server"}
  - {id: knowledge, label: Knowledge, sub: "RAG, CT 105", kind: homelab, col: 2, row: 4.5,
     services: [knowledge-base],
     about: "Document search with pgvector and full-text search"}
  - {id: worker, label: Worker, sub: "Agents, CT 110", kind: homelab, col: 3, row: 0.5,
     services: [sazed-worker],
     about: "Runs Claude Code and Gemini jobs in a sandboxed container"}
  - {id: postgres, label: Postgres, sub: CT 103, kind: homelab, col: 3, row: 4.5,
     services: [postgres], public_sub: "pgvector",
     about: "Databases for the services, with pgvector"}
  - {id: media, label: Media apps, kind: homelab, col: 3, row: 6, services_group: apps,
     public: false}
  - {id: netguard, label: AdGuard, sub: "DNS, CT 111", kind: homelab, col: 2, row: 6,
     services: [netguard], public: false,
     about: "Blocks ads and trackers by DNS for tailnet devices (parked)"}

  # Outside services
  - {id: anthropic, label: Anthropic, sub: Claude models, kind: external, col: 4, row: 0,
     integrations: [anthropic],
     about: "Claude models for Sazed and for Claude Code jobs"}
  - {id: gemini, label: Gemini, sub: via Antigravity, kind: external, col: 4, row: 1,
     about: "Research and second opinions, using Google Search"}
  - {id: github, label: GitHub, sub: "Repos, PRs, CI", kind: external, col: 4, row: 2,
     integrations: [github],
     about: "Repos, CI, deploys and the worker's pull requests"}
  - {id: google, label: Google, sub: "Calendar, Gmail", kind: external, col: 4, row: 3,
     integrations: [google_calendar, google_email, google_tasks, google_storage],
     about: "Calendar, Tasks, Gmail and Drive"}
  - {id: pushover, label: Pushover, sub: Phone alerts, kind: external, col: 4, row: 4,
     integrations: [pushover],
     about: "Notifications to my phone"}

edges:
  - {from: phone, to: console, quiet: true}
  - {from: desktop, to: console, quiet: true}
  - {from: claude-code, to: gateway, signals: [{kind: gw\.mcp}]}
  - {from: console, to: sazed, signals: [{kind: chat\.user}, {kind: approval}]}
  - {from: console, to: gateway, quiet: true}
  - {from: sazed, to: worker, signals: [{kind: job}]}
  - {from: sazed, to: gateway, signals: [{kind: tool}]}
  - {from: sazed, to: anthropic, route: over, signals: [{kind: llm}]}
  - {from: sazed, to: postgres,
     signals: [{kind: "chat\\..*|llm|tool|approval|automation|backlog|job(\\..*)?"}]}
  - {from: gateway, to: knowledge, signals: [{kind: tool, title: "knowledge|kb|ingest"}]}
  - {from: knowledge, to: postgres, signals: [{kind: tool, title: "knowledge|kb|ingest"}]}
  - {from: gateway, to: postgres,
     signals: [{kind: "gw\\.(outage|recovery)"}, {kind: tool, title: journal}]}
  - {from: gateway, to: media, quiet: true, signals: [{kind: "gw\\.(outage|recovery)"}]}
  - {from: gateway, to: proxmox, quiet: true,
     signals: [{kind: tool, title: container}, {kind: gw\.disk}]}
  - {from: gateway, to: github,
     signals: [{kind: job\.ci}, {kind: gw\.deploy},
               {kind: tool, title: "repo|issue|pr|commit|branch|release|github"}]}
  - {from: gateway, to: google,
     signals: [{kind: tool,
                title: "event|availability|task|email|file|folder|sheet|spreadsheet"}]}
  - {from: gateway, to: pushover, signals: [{kind: gw\.notify}]}
  - {from: worker, to: anthropic, signals: [{kind: "job(\\.step)?", agent: claude}]}
  - {from: worker, to: gemini, signals: [{kind: "job(\\.step)?", agent: agy}]}
  - {from: worker, to: github, signals: [{kind: job\.pr}]}
